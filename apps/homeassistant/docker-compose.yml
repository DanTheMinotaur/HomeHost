name: {{app_name}}

services:
  {{app_name}}:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2025.8"
    volumes:
      - "${DOCKER_VOLUMES}/homeassistant/:/config"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 127.0.0.1:8123:8123
    restart: unless-stopped
    privileged: true
  faster-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: faster-whisper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WHISPER_MODEL=base-int8
      - LOCAL_ONLY= #optional
      - WHISPER_BEAM=1 #optional
      - WHISPER_LANG=en #optional
    volumes:
      - "${DOCKER_VOLUMES}/faster-whisper/data:/config"
    # ports:
    #   - 10300:10300
    restart: unless-stopped
