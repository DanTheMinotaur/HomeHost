name: {{app_name}}

services:
  {{app_name}}:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2025.8"
    volumes:
      - "${DOCKER_VOLUMES}/homeassistant/:/config"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 127.0.0.1:8123:8123
    restart: unless-stopped
    privileged: true
