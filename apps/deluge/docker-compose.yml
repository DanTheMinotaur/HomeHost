---
name: {{app_name}}
services:
  {{app_name}}:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - DELUGE_LOGLEVEL=error #optional
    volumes:
      - "${DOCKER_VOLUMES}/deluge/:/config"
      - "${DRIVE_MEDIA}:/mount/"
    ports:
      - 127.0.0.1:8112:8112 # webui
      - 6881:6881 # torrent traffic
      - 6881:6881/udp
      - 58846:58846 # rpc 
    restart: unless-stopped
