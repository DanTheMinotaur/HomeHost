---
- name: "Set variables"
  set_fact:
    docker_path: "{{ ansible_env.HOME }}/docker/{{ app_name }}/"
- name: "Ensures {{ docker_path }} dir exists"
  file:
    path: "{{ docker_path }}"
    state: directory
    owner: "{{ansible_user_id }}"
    group: "{{ansible_user_id }}"
- name: "Copy Docker Compose File | {{ compose_file }} -> {{ docker_path }}"
  template:
    src: "{{ compose_file }}"
    dest: "{{ docker_path }}/compose.yaml"
  register: copied_compose_file
- name: "Copy Docker Labels"
  template:
    src: ./traefik-labels.tpl.yml
    dest: "{{ docker_path }}/labels.yaml"
  when: domains is defined and domains
  register: copied_labels
- name: Copy required files
  template:
    src: "{{ file }}"
    dest: "{{ docker_path }}"
  with_items: "{{ files }}"
  loop_control:
    loop_var: file
  when: files is defined and (files | length > 0)
  register: copied_files
- name: Copy required directories
  copy:
    src: "{{ dir.key }}"
    dest: "{{ docker_path }}/{{ dir.value }}"
  with_dict: "{{ dirs }}"
  loop_control:
    loop_var: dir
  when: dirs is defined and (dirs | length > 0)
  register: copied_dirs
- name: Copy binaries
  copy:
    src: "{{ file }}"
    dest: "{{ docker_path }}"
  with_items: "{{ bins }}"
  loop_control:
    loop_var: file
  when: bins is defined and (bins | length > 0)
  register: copied_bins
